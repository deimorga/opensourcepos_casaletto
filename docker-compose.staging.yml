# Staging — VPS micronuba (srv1269581), detrás del gateway Traefik existente.
# Uso en el VPS (carpeta /root/POS_Casaletto_staging): docker compose -f docker-compose.staging.yml up -d --build
#
# Requiere en el VPS:
#   - Red externa `micronuba_public` (creada por micronuba-infra)
#   - DNS: staging.pos-casaletto.micronuba.net -> IP del VPS (URL legacy)
#   - DNS: *.staging.ospos-saas.micronuba.net -> IP del VPS (wildcard de
#     tenants ficticios de prueba, Fase 9 -- se crea cuando haga falta
#     probar; el router ya existe y es inerte sin este DNS)
#   - Un archivo `.env` (NO versionado, chmod 600) junto a este compose con:
#       MYSQL_ROOT_PASSWORD=...
#       MYSQL_USERNAME=admin
#       MYSQL_PASSWORD=...
#       MYSQL_DB_NAME=ospos
#       ENCRYPTION_KEY=hex2bin:...
#     docker compose lo carga automáticamente para sustituir las ${VARIABLES}
#     de abajo -- no hay secretos en este archivo.

include:
    - docker/docker-mysql.yml

volumes:
    # Apunta al volumen ya migrado a MariaDB 11.4 (dump/restore verificado
    # con checksums idénticos al 10.5 original) en vez de dejar que Compose
    # cree/reuse el volumen por defecto (docker/docker-mysql.yml declara
    # `mysql` con driver:local, que no se puede mezclar con external: true
    # -- por eso esto usa una clave de volumen aparte). El volumen viejo
    # sigue intacto en pos_casaletto_staging_mysql como respaldo.
    mysql_11_4:
        external: true
        name: pos_casaletto_staging_mysql_11_4

services:
    mysql:
        container_name: mysql-casaletto-staging
        volumes: !override
            - mysql_11_4:/var/lib/mysql:rw
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DB_NAME}
            - MYSQL_USER=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    ospos:
        build:
            context: .
            target: ospos
        image: casaletto-ospos:staging
        restart: always
        depends_on:
            - mysql
        networks:
            - app_net
            - micronuba_public
        volumes:
            - uploads:/app/public/uploads
            - logs:/app/writable/logs
        environment:
            - CI_ENVIRONMENT=production
            - FORCE_HTTPS=true
            - PHP_TIMEZONE=America/Bogota
            - MYSQL_USERNAME=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - MYSQL_DB_NAME=${MYSQL_DB_NAME}
            - MYSQL_HOST_NAME=mysql
            - ALLOWED_HOSTNAMES=staging.pos-casaletto.micronuba.net
            # Fase 6 (multi-tenant), corregido 2026-07-31: dominio del SaaS
            # desacoplado de la marca Casaletto (ver docker-compose.prod.yml
            # para el razonamiento completo). Subdominios de tenants
            # ficticios de prueba (Fase 9), ej.
            # demo1.staging.ospos-saas.micronuba.net. Con punto inicial --
            # ver App::$allowedHostnameWildcards.
            - ALLOWED_HOSTNAME_WILDCARDS=.staging.ospos-saas.micronuba.net
            # Ver NOTA en docker/docker-mysql.yml comment above: Sales.php
            # crashea sin esto (Email_lib -> Services::encrypter()). Clave
            # única por ambiente, definida en el .env del VPS, nunca en git.
            - encryption_key=${ENCRYPTION_KEY}
            # Fase 9: grupo de conexión fijo al schema de control (registro
            # de tenants, cuentas de plataforma) -- reusa el usuario
            # compartido de siempre, que necesita un GRANT explícito sobre
            # platform_control además del suyo propio sobre `ospos` (el
            # usuario que crea la imagen oficial de MariaDB solo recibe
            # privilegios sobre la BD declarada en MYSQL_DATABASE al
            # iniciar el contenedor, nunca sobre esquemas creados después
            # a mano -- confirmado al validar esto en local). Ver runbook
            # en docs/Tecnico/multi-tenant-arquitectura.md sección 16.
            - PLATFORM_DB_HOST_NAME=mysql
            - PLATFORM_DB_USERNAME=${MYSQL_USERNAME}
            - PLATFORM_DB_PASSWORD=${MYSQL_PASSWORD}
            - PLATFORM_DB_NAME=platform_control
            # Fase 8: usuario MySQL dedicado y acotado para que la
            # plataforma de gestión de negocios pueda aprovisionar
            # tenants en caliente -- nunca el usuario admin compartido ni
            # root. Ver runbook, sección 16 del mismo documento.
            - PLATFORM_PROVISION_USERNAME=platform_provisioner
            - PLATFORM_PROVISION_PASSWORD=${PLATFORM_PROVISION_PASSWORD}
        labels:
            - "traefik.enable=true"
            # Router de siempre: SOLO la URL de staging de Casaletto
            # (legacy). Ya no dobla como wildcard de tenants de prueba --
            # ver router "ospos-saas-staging" más abajo, dominio separado.
            - "traefik.http.routers.pos-casaletto-staging.rule=Host(`staging.pos-casaletto.micronuba.net`)"
            - "traefik.http.routers.pos-casaletto-staging.entrypoints=websecure"
            # certresolver=le (HTTP-01), NO le-dns: confirmado 2026-08-03 que
            # el token de Cloudflare que ya usa Traefik para le-dns está
            # limitado a la zona plagie.cloud, sin ningún acceso a
            # micronuba.net -- el certificado actual sigue sirviéndose
            # porque se emitió antes del cambio a le-dns, pero la próxima
            # renovación habría fallado en silencio. Revertido a le hasta
            # que alguien con acceso a Cloudflare amplíe ese token (o cree
            # uno nuevo) para micronuba.net -- ver
            # docs/Tecnico/multi-tenant-arquitectura.md sección 16.
            - "traefik.http.routers.pos-casaletto-staging.tls.certresolver=le"
            # Enlace explícito router->service -- ver docker-compose.prod.yml
            # para el porqué (confirmado con un 404 real sin esto).
            - "traefik.http.routers.pos-casaletto-staging.service=pos-casaletto-staging"
            - "traefik.http.services.pos-casaletto-staging.loadbalancer.server.port=80"
            # Router nuevo (corrección 2026-07-31): wildcard de tenants
            # ficticios de prueba (Fase 9) en el dominio propio del SaaS,
            # desacoplado de la marca Casaletto. El nivel ".staging." extra
            # hace que esta regex nunca pueda matchear el wildcard de
            # producción (docker-compose.prod.yml) ni viceversa -- dominios
            # ya estructuralmente separados, sin necesitar priority.
            - "traefik.http.routers.ospos-saas-staging.rule=HostRegexp(`^[a-z0-9-]+\\.staging\\.ospos-saas\\.micronuba\\.net$`)"
            - "traefik.http.routers.ospos-saas-staging.entrypoints=websecure"
            # le, no le-dns -- ver nota larga en pos-casaletto-staging arriba.
            # HTTP-01 no puede emitir un certificado wildcard único, pero sí
            # emite uno por subdominio exacto a medida que cada negocio
            # recibe tráfico real -- suficiente a esta escala; el límite de
            # tasa de Let's Encrypt solo importaría con muchos negocios
            # nuevos por día.
            - "traefik.http.routers.ospos-saas-staging.tls.certresolver=le"
            - "traefik.http.routers.ospos-saas-staging.priority=10"
            - "traefik.http.routers.ospos-saas-staging.service=ospos-saas-staging"
            - "traefik.http.services.ospos-saas-staging.loadbalancer.server.port=80"
            - "traefik.docker.network=micronuba_public"

networks:
    micronuba_public:
        external: true
