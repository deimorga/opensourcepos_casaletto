volumes:
    uploads:
        driver: local
    logs:
        driver: local
    mysql:
        driver: local

networks:
    app_net:


services:
    mysql:
        image: mariadb:11.4
        container_name: mysql
        restart: always
        expose:
            - "3306"
        networks:
            - app_net
        volumes:
            - mysql:/var/lib/mysql:rw
        environment:
            - MYSQL_ROOT_PASSWORD=pointofsale
            - MYSQL_DATABASE=ospos
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=pointofsale
    ospos:
        build:
            context: .
            args:
                - USERID=${USERID}
                - GROUPID=${GROUPID}
            target: ospos_dev
        container_name: ospos_dev
        restart: always
        user: "${USERID}:${GROUPID}"
        depends_on:
            - mysql
        ports:
            - "80:80"
        networks:
            - app_net
        volumes:
            - .:/app
        environment:
            - CI_ENVIRONMENT=development
            - ALLOWED_HOSTNAMES=localhost
            # La consola de plataforma. Este compose publica el puerto 80
            # directamente y no pasa por Traefik, así que aquí no hay router
            # que añadir: basta con un nombre que resuelva a 127.0.0.1
            # (/etc/hosts: 127.0.0.1  ospos-saas.localhost) y con que
            # coincida EXACTAMENTE con esta variable. Sin ella, esa
            # dirección se serviría como si fuera un negocio.
            - PLATFORM_HOSTNAMES=ospos-saas.localhost
            # El esquema de control, que la consola necesita para su registro
            # de negocios y su tabla de sesiones. Hay que crearlo a mano en
            # el contenedor mysql y correr `php spark platform:migrate`.
            - PLATFORM_DB_HOST_NAME=mysql
            - PLATFORM_DB_USERNAME=admin
            - PLATFORM_DB_PASSWORD=pointofsale
            - PLATFORM_DB_NAME=platform_control
            - MYSQL_USERNAME=admin
            - MYSQL_PASSWORD=pointofsale
            - MYSQL_DB_NAME=ospos
            - MYSQL_HOST_NAME=mysql
            - PHP_TIMEZONE=UTC
            - XDEBUG_CONFIG=client_host=172.17.0.1
