; Sitio de configuracion de PHP propio del fork.
;
; Todo archivo .ini que se deje en docker/php/conf.d/ del repositorio entra en la
; imagen --el Dockerfile lo copia a /usr/local/etc/php/conf.d/-- y lo lee el PHP
; que sirve el POS.
;
; POR QUE EXISTE. El unico ajuste de PHP que el fork tenia se escribia con un
; `echo` suelto dentro del Dockerfile (date.timezone). Cualquier otro se aplicaba
; a mano, con `docker exec`, dentro del contenedor que corria en el servidor: y
; ahi es donde se perdia. El contenedor se recrea en cada despliegue y vuelve a
; nacer con la configuracion de la imagen, asi que el ajuste desaparecia en
; silencio. Nada falla y nada avisa -- simplemente deja de estar puesto, mientras
; todo el mundo sigue convencido de que sigue ahi.
;
; ORDEN. PHP lee los .ini del directorio en orden alfabetico y, si una misma
; directiva aparece dos veces, gana la ULTIMA. El prefijo `zz-` deja este archivo
; despues de los `docker-php-ext-*.ini` de la imagen base y despues de
; `timezone.ini`, de modo que lo que se escriba aqui pisa a lo anterior. Es
; deliberado: este es el sitio de los ajustes propios.
;
; NO FIJA NINGUNA DIRECTIVA TODAVIA, A PROPOSITO. Este cambio es solo el
; andamiaje. Los ajustes concretos (memoria, tamano de subida, opcache...) van en
; una fase posterior, uno por uno y con su motivo escrito al lado.
;
; ESTE ARCHIVO NO SE EDITA EN EL SERVIDOR. Viaja dentro de la imagen, y la imagen
; se construye en el VPS desde el repositorio (`docker compose -f
; docker-compose.<env>.yml up -d --build`): una edicion hecha directamente en el
; servidor no llega a ninguna parte y el proximo despliegue la ignora. Un cambio
; se hace aqui, se commitea y se despliega.
;
; SI SE RENOMBRA O SE BORRA: el Dockerfile comprueba, en tiempo de build, que
; este archivo llega al directorio que PHP escanea, y lo hace POR SU NOMBRE. Esa
; comprobacion es la que convierte un `.dockerignore` mal puesto --o un COPY que
; no ocurrio-- en un build roto, en vez de en una configuracion ausente y
; silenciosa. Si cambia el nombre, hay que actualizarla ahi.
