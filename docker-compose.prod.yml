# Producción — VPS micronuba (srv1269581), detrás del gateway Traefik existente.
# Uso en el VPS (carpeta /root/POS_Casaletto): docker compose -f docker-compose.prod.yml up -d --build
#
# Requiere en el VPS:
#   - Red externa `micronuba_public` (creada por micronuba-infra)
#   - DNS: pos-casaletto.micronuba.net -> IP del VPS (pendiente de crear)
#   - Un archivo `.env` (NO versionado, chmod 600) junto a este compose con:
#       MYSQL_ROOT_PASSWORD=...
#       MYSQL_USERNAME=admin
#       MYSQL_PASSWORD=...
#       MYSQL_DB_NAME=ospos
#       ENCRYPTION_KEY=hex2bin:...
#     docker compose lo carga automáticamente para sustituir las ${VARIABLES}
#     de abajo -- no hay secretos en este archivo.

include:
    - docker/docker-mysql.yml

volumes:
    # Apunta al volumen ya migrado a MariaDB 11.4 (dump/restore verificado
    # con checksums idénticos al 10.5 original) en vez de dejar que Compose
    # cree/reuse el volumen por defecto (docker/docker-mysql.yml declara
    # `mysql` con driver:local, que no se puede mezclar con external: true
    # -- por eso esto usa una clave de volumen aparte). El volumen viejo
    # sigue intacto en pos_casaletto_mysql como respaldo.
    mysql_11_4:
        external: true
        name: pos_casaletto_mysql_11_4

services:
    mysql:
        container_name: mysql-casaletto-prod
        volumes: !override
            - mysql_11_4:/var/lib/mysql:rw
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DB_NAME}
            - MYSQL_USER=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    ospos:
        build:
            context: .
            target: ospos
        image: casaletto-ospos:prod
        restart: always
        depends_on:
            - mysql
        networks:
            - app_net
            - micronuba_public
        volumes:
            - uploads:/app/public/uploads
            - logs:/app/writable/logs
        environment:
            - CI_ENVIRONMENT=production
            - FORCE_HTTPS=true
            - PHP_TIMEZONE=America/Bogota
            - MYSQL_USERNAME=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - MYSQL_DB_NAME=${MYSQL_DB_NAME}
            - MYSQL_HOST_NAME=mysql
            - ALLOWED_HOSTNAMES=pos-casaletto.micronuba.net
            # Fase 6 (multi-tenant): subdominio de cada negocio-cliente, ej.
            # clientex.pos-casaletto.micronuba.net. Con punto inicial -- ver
            # App::$allowedHostnameWildcards. "staging" queda reservado (no
            # se asigna nunca como slug de tenant, ver Fase 7) para no
            # ambiguar con staging.pos-casaletto.micronuba.net.
            - ALLOWED_HOSTNAME_WILDCARDS=.pos-casaletto.micronuba.net
            # Ver NOTA en docker/docker-mysql.yml comment above: Sales.php
            # crashea sin esto (Email_lib -> Services::encrypter()). Clave
            # única por ambiente, definida en el .env del VPS, nunca en git.
            - encryption_key=${ENCRYPTION_KEY}
        labels:
            - "traefik.enable=true"
            # Fase 6 (multi-tenant): agrega el wildcard de subdominios de
            # negocios-cliente al router existente, sin tocar el host
            # exacto de Casaletto. certresolver pasa a le-dns (DNS-01 vía
            # Cloudflare, ya en uso real por otro proyecto en este mismo
            # Traefik) porque HostRegexp no es validable con HTTP-01 de
            # forma confiable a medida que se agregan tenants. priority
            # más bajo que el de staging (docker-compose.staging.yml) para
            # que, en el único caso ambiguo posible (el string literal
            # "staging.pos-casaletto.micronuba.net", que matchea este
            # wildcard de un solo nivel), el router de staging le gane
            # siempre -- refuerzo adicional a que "staging" nunca se
            # asigne como slug real (Fase 7).
            - "traefik.http.routers.pos-casaletto.rule=Host(`pos-casaletto.micronuba.net`) || HostRegexp(`^[a-z0-9-]+\\.pos-casaletto\\.micronuba\\.net$`)"
            - "traefik.http.routers.pos-casaletto.entrypoints=websecure"
            # certresolver=le (HTTP-01), NO le-dns: confirmado 2026-08-03 que
            # el token de Cloudflare que ya usa Traefik para le-dns está
            # limitado a la zona plagie.cloud, sin ningún acceso a
            # micronuba.net. El certificado actual sigue sirviéndose porque
            # se emitió antes de este cambio a le-dns, pero la próxima
            # renovación habría fallado en silencio. Revertido a le hasta
            # que alguien con acceso a Cloudflare amplíe ese token (o cree
            # uno nuevo) para micronuba.net.
            - "traefik.http.routers.pos-casaletto.tls.certresolver=le"
            - "traefik.http.routers.pos-casaletto.priority=10"
            - "traefik.http.services.pos-casaletto.loadbalancer.server.port=80"
            - "traefik.docker.network=micronuba_public"

networks:
    micronuba_public:
        external: true
