# Producción — VPS micronuba (srv1269581), detrás del gateway Traefik existente.
# Uso en el VPS (carpeta /root/POS_Casaletto): docker compose -f docker-compose.prod.yml up -d --build
#
# Requiere en el VPS:
#   - Red externa `micronuba_public` (creada por micronuba-infra)
#   - DNS: pos-casaletto.micronuba.net -> IP del VPS (URL legacy de Casaletto)
#   - DNS: *.ospos-saas.micronuba.net -> IP del VPS (wildcard de negocios-
#     cliente del SaaS -- se crea recién cuando haya un tenant real que
#     provisionar, Fase 7+; el router ya existe y es inerte sin este DNS)
#   - Un archivo `.env` (NO versionado, chmod 600) junto a este compose con:
#       MYSQL_ROOT_PASSWORD=...
#       MYSQL_USERNAME=admin
#       MYSQL_PASSWORD=...
#       MYSQL_DB_NAME=ospos
#       ENCRYPTION_KEY=hex2bin:...
#     docker compose lo carga automáticamente para sustituir las ${VARIABLES}
#     de abajo -- no hay secretos en este archivo.

include:
    - docker/docker-mysql.yml

services:
    mysql:
        container_name: mysql-casaletto-prod
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DB_NAME}
            - MYSQL_USER=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    ospos:
        build:
            context: .
            target: ospos
        image: casaletto-ospos:prod
        restart: always
        depends_on:
            - mysql
        networks:
            - app_net
            - micronuba_public
        volumes:
            - uploads:/app/public/uploads
            - logs:/app/writable/logs
        environment:
            - CI_ENVIRONMENT=production
            - FORCE_HTTPS=true
            - PHP_TIMEZONE=America/Bogota
            - MYSQL_USERNAME=${MYSQL_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - MYSQL_DB_NAME=${MYSQL_DB_NAME}
            - MYSQL_HOST_NAME=mysql
            - ALLOWED_HOSTNAMES=pos-casaletto.micronuba.net
            # Fase 6 (multi-tenant), corregido 2026-07-31: la marca del
            # SaaS NO puede ser "pos-casaletto" -- Casaletto es un cliente
            # más de la plataforma, no la plataforma misma. Subdominio de
            # cada negocio-cliente, ej. clientex.ospos-saas.micronuba.net
            # (Casaletto mismo pasará a ser casaletto.ospos-saas.micronuba.net
            # cuando se provisione como tenant, Fase 10 -- su URL actual
            # arriba no se toca, sigue funcionando igual mientras tanto).
            # Con punto inicial -- ver App::$allowedHostnameWildcards.
            # "staging"/"www"/"admin"/"platform"/"login"/"api"/"app"
            # quedan reservados, nunca asignables a un tenant (Fase 7).
            - ALLOWED_HOSTNAME_WILDCARDS=.ospos-saas.micronuba.net
            # Ver NOTA en docker/docker-mysql.yml comment above: Sales.php
            # crashea sin esto (Email_lib -> Services::encrypter()). Clave
            # única por ambiente, definida en el .env del VPS, nunca en git.
            - encryption_key=${ENCRYPTION_KEY}
        labels:
            - "traefik.enable=true"
            # Router de siempre: SOLO la URL propia de Casaletto (legacy,
            # sin corte de servicio). Ya no dobla como wildcard del SaaS
            # -- ver router "ospos-saas" más abajo, dominio separado.
            - "traefik.http.routers.pos-casaletto.rule=Host(`pos-casaletto.micronuba.net`)"
            - "traefik.http.routers.pos-casaletto.entrypoints=websecure"
            - "traefik.http.routers.pos-casaletto.tls.certresolver=le-dns"
            - "traefik.http.services.pos-casaletto.loadbalancer.server.port=80"
            # Router nuevo (corrección 2026-07-31): wildcard de negocios-
            # cliente en un dominio propio del SaaS, desacoplado de la marca
            # Casaletto. Mismo servicio/contenedor que el router de arriba
            # -- un solo `ospos` sirve a todos los negocios y a Casaletto.
            - "traefik.http.routers.ospos-saas.rule=HostRegexp(`^[a-z0-9-]+\\.ospos-saas\\.micronuba\\.net$`)"
            - "traefik.http.routers.ospos-saas.entrypoints=websecure"
            - "traefik.http.routers.ospos-saas.tls.certresolver=le-dns"
            - "traefik.http.routers.ospos-saas.priority=10"
            - "traefik.http.services.ospos-saas.loadbalancer.server.port=80"
            - "traefik.docker.network=micronuba_public"

networks:
    micronuba_public:
        external: true
