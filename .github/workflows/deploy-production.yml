name: Deploy Production (POS_Casaletto)

# Todo el despliegue vive en scripts/deploy.sh (versionado, el mismo para staging y producción,
# y el único camino admitido también a mano). Este workflow solo:
#   1. exige que la suite haya pasado en CI para ese código, y
#   2. lleva el script de ESE commit al servidor y lo ejecuta.
# Por qué, y qué comprueba el script: docs/Tecnico/despliegue.md.

on:
  workflow_dispatch:
    inputs:
      autorizado_en_horario:
        description: 'El dueño autorizó desplegar antes de las 22:00 (hora Colombia)'
        type: boolean
        default: false
      ignorar_actividad:
        description: 'Desplegar aunque haya usuarios trabajando (solo con autorización del dueño)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Pruebas del commit en verde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PHPUnit solo corre cuando un push toca código (filtros de phpunit.yml). Un commit
      # de solo documentación o de solo despliegue no tiene corrida propia, y exigirla
      # dejaría el despliegue esperando algo que nunca llega (pasó el 2026-09-29).
      #
      # Regla: se busca, hacia atrás desde este commit, el primero con PHPUnit terminado.
      # Tiene que estar en verde, y entre él y este commit no puede haber cambios en nada de
      # lo que dispara PHPUnit. Si lo hay y esa corrida aún no terminó, se espera.
      - name: PHPUnit en verde para lo que se despliega
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Mismos filtros que phpunit.yml (on.push.paths). Si cambian allí, cambiarlos aquí.
          PATHS=(':(glob)**/*.php' 'spark' 'tests' 'app/Database' 'composer.json' 'composer.lock' \
                 'Dockerfile' 'package.json' 'package-lock.json' 'gulpfile.js' '.github/workflows/phpunit.yml')
          for attempt in $(seq 1 50); do
            runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow phpunit.yml -L 200 \
              --json headSha,status,conclusion --jq '.[] | "\(.headSha) \(.status) \(.conclusion)"')"
            verdict=""
            for c in $(git rev-list --max-count=200 "$SHA"); do
              line="$(echo "$runs" | grep "^$c " | head -1 || true)"
              [ -z "$line" ] && continue
              status="$(echo "$line" | cut -d' ' -f2)"; conclusion="$(echo "$line" | cut -d' ' -f3)"
              if ! git diff --quiet "$c" "$SHA" -- "${PATHS[@]}"; then
                # Hay código posterior a esta corrida: no sirve como prueba de $SHA.
                verdict="sin-corrida"; break
              fi
              if [ "$status" != completed ]; then verdict="esperando ${c:0:9}"; break; fi
              if [ "$conclusion" = success ]; then
                echo "PHPUnit en verde en ${c:0:9}; sin cambios de código hasta ${SHA:0:9}."; exit 0
              fi
              verdict="fallo ${c:0:9} ($conclusion)"; break
            done
            case "$verdict" in
              fallo*) echo "::error::PHPUnit $verdict. No se despliega."; exit 1 ;;
              esperando*) echo "Esperando PHPUnit ($verdict, $attempt/50)..."; sleep 30 ;;
              *) if [ "$attempt" -lt 5 ]; then
                   # Recién hecho el push, la corrida tarda unos segundos en aparecer.
                   echo "Aún no aparece una corrida de PHPUnit que cubra ${SHA:0:9} ($attempt/5)..."; sleep 30
                 else
                   echo "::error::No hay una corrida de PHPUnit que cubra ${SHA:0:9}."; exit 1
                 fi ;;
            esac
          done
          echo "::error::PHPUnit no terminó en 25 minutos."; exit 1

  deploy:
    name: Desplegar master en producción
    needs: tests
    runs-on: ubuntu-latest
    environment: POS_Casaletto
    timeout-minutes: 45
    steps:
      # Sin appleboy/ssh-action: no reintenta, y Hostinger corta de forma intermitente el SSH
      # que viene de GitHub (visto en agosto y otra vez el 2026-09-29, `dial tcp :22: i/o
      # timeout`). Aquí se prueba la conexión con reintentos y solo después se despliega. El
      # despliegue en sí NO se reintenta: si la conexión cae a mitad, se lee /root/deploys.log.
      - name: Conectar al servidor (con reintentos)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          for i in $(seq 1 8); do
            if ssh vps true; then echo "Conectado (intento $i)."; exit 0; fi
            echo "Sin conexión (intento $i/8); reintento en $((i * 15)) s."; sleep $((i * 15))
          done
          echo "::error::No hubo conexión SSH con el servidor en 8 intentos. No se tocó nada."; exit 1

      # El script corre DESACOPLADO en el servidor (setsid + nohup) y escribe su propio
      # registro. Si la conexión se cae a mitad, el despliegue sigue y termina igual; este paso
      # solo lo acompaña, reconectándose, y devuelve su código de salida.
      - name: Desplegar con scripts/deploy.sh
        env:
          LOG: /root/deploy-logs/prod-${{ github.run_id }}-${{ github.run_attempt }}.log
        run: |
          # shellcheck disable=SC2029  # $LOG y el commit se expanden aquí a propósito.
          set -uo pipefail
          ssh vps "set -e
            mkdir -p /root/deploy-logs
            cd /root/POS_Casaletto
            git fetch --quiet origin master
            git show ${{ github.sha }}:scripts/deploy.sh > /tmp/ospos-deploy-prod.sh
            setsid nohup bash -c 'ALLOW_BUSINESS_HOURS=${{ inputs.autorizado_en_horario && '1' || '0' }} IGNORE_ACTIVITY=${{ inputs.ignorar_actividad && '1' || '0' }} bash /tmp/ospos-deploy-prod.sh prod ${{ github.sha }}; echo \$? > $LOG.rc' > $LOG 2>&1 < /dev/null &" \
            || { echo "::error::No se pudo lanzar el despliegue."; exit 1; }

          off=0
          for _ in $(seq 1 270); do
            sleep 10
            size="$(ssh vps "stat -c %s $LOG 2>/dev/null || echo 0")" || { echo "(sin conexión; el despliegue sigue en el servidor)"; continue; }
            if [ "$size" -gt "$off" ] && ssh vps "tail -c +$((off + 1)) $LOG | head -c $((size - off))"; then
              off="$size"
            fi
            rc="$(ssh vps "cat $LOG.rc 2>/dev/null")" || continue
            if [ -n "$rc" ]; then
              size="$(ssh vps "stat -c %s $LOG")" && [ "$size" -gt "$off" ] && ssh vps "tail -c +$((off + 1)) $LOG"
              echo "Registro completo en el servidor: $LOG"
              exit "$rc"
            fi
          done
          echo "::error::El despliegue no terminó en 45 minutos. Registro: $LOG"; exit 1

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
