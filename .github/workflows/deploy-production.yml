name: Deploy Production (POS_Casaletto)

# Todo el despliegue vive en scripts/deploy.sh (versionado, el mismo para staging y producción,
# y el único camino admitido también a mano). Este workflow solo:
#   1. exige que la suite de ese mismo commit haya pasado en CI, y
#   2. lleva el script de ESE commit al servidor y lo ejecuta.
# Por qué, y qué comprueba el script: docs/Tecnico/despliegue.md.

on:
  workflow_dispatch:
    inputs:
      autorizado_en_horario:
        description: 'El dueño autorizó desplegar antes de las 22:00 (hora Colombia)'
        type: boolean
        default: false
      ignorar_actividad:
        description: 'Desplegar aunque haya usuarios trabajando (solo con autorización del dueño)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Pruebas del commit en verde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esperar el workflow «PHPUnit Tests» de ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            result="$(gh run list -R "$GITHUB_REPOSITORY" --workflow phpunit.yml --commit "$SHA" \
              --json status,conclusion --jq 'map(select(.status == "completed")) | map(.conclusion) | join(" ")')"
            pending="$(gh run list -R "$GITHUB_REPOSITORY" --workflow phpunit.yml --commit "$SHA" \
              --json status --jq 'map(select(.status != "completed")) | length')"
            if echo " $result " | grep -q ' success '; then
              echo "PHPUnit en verde para $SHA."; exit 0
            fi
            if [ -n "$result" ] && [ "$pending" = 0 ]; then
              echo "::error::PHPUnit terminó sin éxito para $SHA ($result). No se despliega."; exit 1
            fi
            echo "Esperando PHPUnit ($i/50)..."; sleep 30
          done
          echo "::error::No hay un PHPUnit en verde para $SHA en 25 minutos."; exit 1

  deploy:
    name: Desplegar master en producción
    needs: tests
    runs-on: ubuntu-latest
    environment: POS_Casaletto
    steps:
      - name: Desplegar con scripts/deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            cd /root/POS_Casaletto
            git fetch --quiet origin master
            git show ${{ github.sha }}:scripts/deploy.sh > /tmp/ospos-deploy-prod.sh
            ALLOW_BUSINESS_HOURS=${{ inputs.autorizado_en_horario && '1' || '0' }} IGNORE_ACTIVITY=${{ inputs.ignorar_actividad && '1' || '0' }} bash /tmp/ospos-deploy-prod.sh prod ${{ github.sha }}
