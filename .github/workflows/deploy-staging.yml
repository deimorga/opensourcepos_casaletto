name: Deploy Staging (POS_Casaletto_staging)

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy develop to staging VPS
    runs-on: ubuntu-latest
    environment: POS_Casaletto_staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 300s
          script: |
            set -e
            cd /root/POS_Casaletto_staging

            echo "Sincronizando codigo (develop)..."
            git fetch origin develop
            git reset --hard origin/develop
            git clean -fd

            # AQUI HABIA un `docker run --rm ... php:8.4-cli` que instalaba
            # Composer y Node en el servidor y ejecutaba `composer install`,
            # `npm ci` y `npm run build` sobre el directorio de trabajo, ANTES de
            # construir la imagen.
            #
            # Sobra desde el 2026-09-16: el Dockerfile ya lo hace DENTRO de la
            # imagen. La etapa `vendor` corre `composer install --no-dev
            # --optimize-autoloader` y la etapa `assets` corre las tareas de gulp
            # --mas la comprobacion de que los bloques inject quedaron rellenos y
            # de que el autoload resuelve `App\`--. El `up -d --build` de abajo
            # construye el target `ospos`, que es el que depende de esas dos
            # etapas, asi que ejecutarlo ya compila todo.
            #
            # El texto que acompanaba al bloque decia "el Dockerfile solo copia,
            # no compila". Fue cierto hasta esa fecha; desde entonces es falso, y
            # dejarlo escrito confundia sobre cual es la fuente real de `vendor/`
            # y de `public/resources`.
            #
            # Y no era solo redundante: compilaba en el directorio de trabajo del
            # servidor, que es exactamente la dependencia que se quito --un clon
            # limpio debe producir una imagen completa por si solo, sin ningun
            # paso previo a mano--.

            echo "Reconstruyendo la imagen (compila vendor y assets dentro) y levantando contenedores..."
            docker compose -f docker-compose.staging.yml up -d --build

            echo "Limpiando imagenes huerfanas..."
            docker image prune -f

            echo "Deploy a staging completado."
