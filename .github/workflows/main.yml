name: Coding Standards

# EN PAUSA desde el 2026-09-24, con fecha de reencendido. NO es que sobre.
#
# POR QUE
#   Este workflow corre `composer update`, y Composer se niega a instalar un
#   paquete con avisos de seguridad ABIERTOS. Hoy queda uno: `dompdf/dompdf`
#   2.0.x. El de `codeigniter4/framework` ya esta cerrado en la rama
#   `deps/codeigniter-4.7.4`.
#
#   O sea: no falla porque el codigo viole el estandar. Falla en
#   `Install dependencies`, antes de que PHP CS Fixer llegue a ejecutarse. Nunca
#   ha llegado a decirnos nada sobre el estilo del codigo.
#
#   Hasta el 2026-09-23 el filtro de rutas de aqui abajo apuntaba a
#   `.github/workflows/test-coding-standards.yml`, un fichero que no existe, asi
#   que este workflow casi no se disparaba y su rojo no se veia. Al corregirlo
#   paso a dispararse en cada cambio de PHP --y a fallar, en cada uno--. Cambiamos
#   «no se ejecuta y nadie lo sabe» por «se ejecuta y falla a la vista», que es lo
#   correcto, pero a la 1 de la madrugada son decenas de correos rojos por una
#   causa que ya esta identificada y con arreglo en marcha.
#
# CUANDO SE REENCIENDE
#   En cuanto aterrice la subida de dompdf a 3.1.6. Ese dia, esto vuelve a
#   `push:` y `pull_request:` --los bloques estan justo abajo, listos-- y deberia
#   ponerse verde por primera vez.
#
#   Si el 2026-10-31 sigue en pausa, es que la subida se atasco: hay que
#   reabrirlo o decidir explicitamente que este fork no comprueba estandar.
#   Un workflow en pausa sin fecha es un workflow abandonado.
#
# Mientras tanto queda en `workflow_dispatch` para poder lanzarlo a mano y ver si
# el bloqueo ya cayo, sin que mande correo a nadie.
#
# Nota para el reencendido: los filtros de abajo llevan ya `composer.json` y
# `composer.lock`. Sin ellos --como estaba-- una subida de dependencias no
# disparaba este workflow, que es justo el unico que las instala. Lo descubrimos
# cuando la subida de CodeIgniter paso por delante sin que se enterara.
on:
  workflow_dispatch:

  # push:
  #   paths:
  #     - '**.php'
  #     - 'spark'
  #     - 'composer.json'
  #     - 'composer.lock'
  #     - '.github/workflows/main.yml'
  # pull_request:
  #   paths:
  #     - '**.php'
  #     - 'spark'
  #     - 'composer.json'
  #     - 'composer.lock'
  #     - '.github/workflows/main.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php-version }} Lint with PHP CS Fixer
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-version }}-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer update --ansi --no-interaction

      - name: Run lint on `app/`, `public/`
        run: vendor/bin/php-cs-fixer fix --verbose --ansi --dry-run --config=.php-cs-fixer.no-header.php --using-cache=no --diff
