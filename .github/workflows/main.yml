name: Coding Standards

# REENCENDIDO el 2026-09-24, el mismo dia que se pauso. Se deja escrita la
# historia entera porque explica por que este workflow nunca habia dicho nada.
#
# LO QUE PASO, EN ORDEN
#
#   1. Durante meses el filtro de rutas apuntaba a
#      `.github/workflows/test-coding-standards.yml`, un fichero que NO EXISTE
#      --el workflow es `main.yml`--. Asi que casi no se disparaba, y su rojo no
#      se veia. Corregido el 2026-09-23.
#
#   2. Al corregirlo empezo a dispararse de verdad... y a fallar en todas. No
#      por el estilo del codigo: fallaba en `Install dependencies`, porque
#      `composer update` se niega a instalar paquetes con avisos de seguridad
#      ABIERTOS. PHP CS Fixer no llegaba a ejecutarse nunca.
#
#   3. Los dos bloqueos eran `codeigniter4/framework` 4.7.2 y `dompdf/dompdf`
#      2.0.x. Se pauso este workflow mientras se cerraban, para no ahogar el
#      canal de avisos con un rojo cuya causa ya estaba identificada.
#
#   4. Cerrados los dos --4.7.4 y 3.1.6--, `composer audit` esta en CERO avisos.
#      El bloqueo desaparecio y esto vuelve a `push` y `pull_request`.
#
# ESTA EJECUCION ES LA PRIMERA QUE DE VERDAD COMPRUEBA EL ESTILO DEL CODIGO.
# Si sale roja, esta vez SI habla de codigo, y hay que leerla.
#
# 2026-09-29: TRINQUETE. Salio roja en todas: 1.417 de 1.539 archivos heredados de
# upstream no cumplen el estilo. Reformatearlos de golpe no es inocuo --reglas como
# strict_comparison cambian == por ===, o sea comportamiento--, y un rojo permanente no
# avisa de nada. Ahora:
#   - .php-cs-fixer-baseline.txt lista los archivos que YA incumplian ese dia;
#   - falla si incumple un archivo que NO esta en la lista (uno nuevo, o uno que estaba
#     limpio y se ensucio);
#   - avisa de los que estan en la lista y ya cumplen, para sacarlos de ella.
# Un archivo sale de la lista cuando alguien lo arregla a proposito, con sus pruebas.
#
# Y `composer install` en vez de `composer update`: con update la version de PHP CS
# Fixer flotaba y marcaba 8 archivos mas que la fijada en composer.lock.
#
# Los filtros llevan ahora `composer.json` y `composer.lock`: sin ellos, una
# subida de dependencias no disparaba el unico workflow que las instala. Se vio
# cuando la subida de CodeIgniter paso por delante sin que este se enterara.
on:
  workflow_dispatch:

  push:
    paths:
      - '**.php'
      - 'spark'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/main.yml'
      - '.php-cs-fixer-baseline.txt'
  pull_request:
    paths:
      - '**.php'
      - 'spark'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/main.yml'
      - '.php-cs-fixer-baseline.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php-version }} Lint with PHP CS Fixer
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-version }}-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction

      - name: Estilo en `app/` y `public/` (trinquete sobre .php-cs-fixer-baseline.txt)
        run: |
          set -uo pipefail
          vendor/bin/php-cs-fixer fix --dry-run --config=.php-cs-fixer.no-header.php --using-cache=no --format=json > cs.json || true
          jq -r '.files[].name' cs.json | sort -u > incumplen.txt
          sort -u .php-cs-fixer-baseline.txt > lista.txt
          nuevos="$(comm -23 incumplen.txt lista.txt)"
          limpios="$(comm -13 incumplen.txt lista.txt | while read -r f; do [ -f "$f" ] && echo "$f"; done)"
          echo "Incumplen $(wc -l < incumplen.txt) archivos; la lista admite $(wc -l < lista.txt)."
          if [ -n "$limpios" ]; then
            echo "::notice::Ya cumplen y pueden salir de .php-cs-fixer-baseline.txt:"
            echo "$limpios"
          fi
          if [ -n "$nuevos" ]; then
            echo "::error::Incumplen el estilo y no estaban en la lista:"
            echo "$nuevos"
            echo "Arreglarlos con: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.no-header.php <archivo>"
            for f in $nuevos; do
              vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.no-header.php --using-cache=no "$f" || true
            done
            exit 1
          fi
          echo "Ningún archivo nuevo incumple el estilo."
