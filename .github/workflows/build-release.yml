name: Build

# Este workflow ya NO publica nada. Se recorto el 2026-09-23 y la razon queda escrita
# aqui para que nadie la reintroduzca "a ver que pasa" en la proxima sincronizacion con
# upstream.
#
# QUE SE QUITO Y POR QUE
#
#   - Los dos pasos `upload-artifact`. Nadie los consume: el despliegue real se hace por
#     SSH contra el VPS, que construye la imagen alli desde el repositorio. Ademas el
#     segundo subia `path: .` con `include-hidden-files: true`, es decir **el arbol de
#     trabajo entero** --con `.env` y `vendor/` dentro-- como artefacto descargable por
#     cualquiera, porque este repositorio es publico.
#
#     Ese paso es tambien el que venia fallando en cada push desde el 2026-07-09:
#     `actions/upload-artifact` rechaza `?` en los nombres de fichero, y el wiki
#     vendorizado trae uno. 26 de las ultimas 27 ejecuciones murieron ahi.
#
#   - Los jobs `docker` y `release`. Son maquinaria del proyecto original: publican una
#     imagen en Docker Hub y un prerelease `unstable`. Este fork no consume ninguna de
#     las dos y no tiene los secretos que exigen. Llevaban en `skipped` desde julio
#     unicamente porque `build` fallaba antes; arreglar `build` sin quitarlos los habria
#     despertado, cambiando un fallo por una publicacion que nadie pidio.
#
# QUE SE CONSERVA, Y ES LO QUE DE VERDAD APORTA
#
#   El job `build` es el UNICO sitio del CI donde se ejecutan `npm run build` y
#   `gulp compress`. `phpunit.yml` solo hace `npm install`; `main.yml` y `php-linter.yml`
#   ni tocan node. Y un build de assets roto no da error: sirve la pagina con 200 y sin
#   una linea de CSS ni de JavaScript. Esta comprobacion es la que lo atrapa antes de
#   que llegue al mostrador.

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, mysqli, gd, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Get npm cache directory
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Install gulp globally
        run: npm install -g gulp-cli

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep "application_version" app/Config/App.php | sed "s/.*= '\(.*\)';/\1/g")
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/feature\///' | tr '/' '_')
          TAG=$(echo "${GITHUB_TAG:-$BRANCH}" | tr '/' '_')
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-tag=$VERSION-$BRANCH-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        env:
          GITHUB_TAG: ${{ github.ref_name }}

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's/production/development/g' .env

      - name: Update commit hash
        run: |
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          sed -i "s/commit_sha1 = 'dev'/commit_sha1 = '$SHORT_SHA'/g" app/Config/OSPOS.php

      - name: Build frontend assets
        run: npm run build

      - name: Create distribution archives
        run: |
          set -euo pipefail
          gulp compress
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          mv dist/opensourcepos.tar "dist/opensourcepos.$VERSION.$SHORT_SHA.tar"
          mv dist/opensourcepos.zip "dist/opensourcepos.$VERSION.$SHORT_SHA.zip"
