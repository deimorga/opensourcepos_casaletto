name: PHPUnit Tests

on:
  push:
    paths:
      - '**.php'
      - 'spark'
      - 'tests/**'
      - '.github/workflows/phpunit.yml'
      - 'gulpfile.js'
      - 'app/Database/**'
  pull_request:
    paths:
      - '**.php'
      - 'spark'
      - 'tests/**'
      - '.github/workflows/phpunit.yml'
      - 'gulpfile.js'
      - 'app/Database/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Tests
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm install

      - name: Start MariaDB
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ospos \
            -e MYSQL_USER=admin \
            -e MYSQL_PASSWORD=pointofsale \
            -p 3306:3306 \
            mariadb:11.4
          # Wait for MariaDB to be ready, but give up rather than spin forever. This loop used to
          # have no bound: when the container failed to come up, docker exec kept failing and the
          # step ran until the six-hour job limit, so this workflow reported nothing at all rather
          # than reporting a failure. Print the container's own logs on the way out, because the
          # reason is in there and nowhere else.
          # healthcheck.sh is the probe the MariaDB image ships for exactly this, and it is named
          # the same across versions. The previous probe called mysqladmin, which 11.4 no longer
          # provides -- the mysql-named symlinks are gone -- so docker exec failed instantly on
          # every attempt while --silent and the if-condition swallowed "executable file not
          # found". The database was accepting connections four seconds in; nothing was ever wrong
          # with it.
          for attempt in $(seq 1 60); do
            if docker exec mysql healthcheck.sh --connect --innodb_initialized; then
              echo "MariaDB is ready after ${attempt} attempts."
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=mysql)" ]; then
              echo "::error::The MariaDB container is no longer running."
              docker logs mysql || true
              exit 1
            fi
            echo "Waiting for MariaDB... (${attempt}/60)"
            sleep 2
          done
          echo "::error::MariaDB did not become ready within 120 seconds."
          echo "--- probe output ---"
          docker exec mysql healthcheck.sh --connect --innodb_initialized || true
          echo "--- container logs ---"
          docker logs mysql || true
          exit 1

      - name: Get composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-version }}-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer update --ansi --no-interaction

      - name: Create .env file
        run: cp .env.example .env

      - name: Run PHPUnit tests
        env:
          CI_ENVIRONMENT: testing
          MYSQL_HOST_NAME: 127.0.0.1
        run: composer test -- --log-junit test-results/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: test-results/
          retention-days: 30

      - name: Stop MariaDB
        if: always()
        run: docker stop mysql && docker rm mysql
